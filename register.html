```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GMSC Registration</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:#07152f;
    color:white;
    padding:22px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:800;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

.card{
    background:white;
    padding:35px;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h1{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#155eef;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d4dcc;
}

.message{
    display:none;
    padding:14px;
    margin-top:20px;
    border-radius:7px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.registration-id{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

}

</style>

</head>

<body>


<header>

<div class="logo">
GMSC
</div>

<nav>

<a href="/">
Home
</a>

<a href="/register">
Register
</a>

<a href="/exam">
Exam
</a>

<a href="/admin">
Admin
</a>

</nav>

</header>


<div class="container">

<div class="card">

<h1>
GMSC Registration
</h1>

<p>
Register for the Global Mathematics & Science Competition.
</p>


<form id="registrationForm">


<label for="name">
Full Name
</label>

<input
    id="name"
    type="text"
    placeholder="Enter your full name"
    required
>


<label for="studentId">
Student ID
</label>

<input
    id="studentId"
    type="text"
    placeholder="Enter your student ID"
    required
>


<label for="email">
Email Address
</label>

<input
    id="email"
    type="email"
    placeholder="Enter your email address"
    required
>


<button type="submit">
Register for GMSC
</button>


</form>


<div
    id="message"
    class="message"
>
</div>

</div>

</div>


<script>

const form =
    document.getElementById(
        "registrationForm"
    );

const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.style.display =
            "none";


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const studentId =
            document
                .getElementById("studentId")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        try{

            const response =
                await fetch(
                    "/api/register",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name,
                                studentId,
                                email

                            })

                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Registration failed."
                );

            }


            message.className =
                "message success";


            message.innerHTML = `

                <strong>
                    Registration successful!
                </strong>

                <br><br>

                Your Registration ID is:

                <div class="registration-id">
                    ${data.registration.registrationId}
                </div>

                <br>

                Please save this Registration ID.

            `;


            message.style.display =
                "block";


            form.reset();


        }catch(error){

            message.className =
                "message error";


            message.textContent =
                error.message;


            message.style.display =
                "block";

        }

    }
);

</script>

</body>

</html>
```
