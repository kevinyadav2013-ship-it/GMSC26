<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GMSC | Student Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#07152f,#104f8a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.register-container{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-circle{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#28c7e8;
    color:#07152f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:20px;
    margin:0 auto 12px;
}

.logo h1{
    color:#07152f;
    font-size:30px;
}

.logo p{
    color:#667085;
    margin-top:6px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#172033;
}

.form-group input,
.form-group select{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#28c7e8;
}

.register-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#07152f;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#104f8a;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#104f8a;
    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}

.notice{
    background:#eef8ff;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
    color:#344054;
    font-size:14px;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="register-container">

    <div class="logo">

        <div class="logo-circle">
            GM
        </div>

        <h1>GMSC</h1>

        <p>Student Registration</p>

    </div>


    <div class="notice">

        Please enter your details carefully.
        Your registration information will be used for the GMSC examination.

    </div>


    <form>

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="school">
                School Name
            </label>

            <input
                type="text"
                id="school"
                placeholder="Enter your school name"
                required
            >

        </div>


        <div class="form-group">

            <label for="class">
                Class
            </label>

            <select id="class" required>

                <option value="">
                    Select your class
                </option>

                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>
                <option>Class 11</option>
                <option>Class 12</option>

            </select>

        </div>


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

        </div>


        <button
            type="submit"
            class="register-btn">
            Register for GMSC
        </button>

    </form>


    <a href="index.html" class="back">
        ← Back to GMSC Home
    </a>

</div>

</body>
</html>
