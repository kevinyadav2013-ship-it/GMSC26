<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GMSC Registration</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07152f;
}

.container{
    width:100%;
    max-width:520px;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

h1{
    margin-top:0;
    color:#07152f;
}

.subtitle{
    color:#667085;
    line-height:1.5;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#155eef;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#004eea;
}

.message{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:8px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.registration-id{
    margin-top:15px;
    padding:15px;
    background:#f2f4f7;
    border-radius:8px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#155eef;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
GMSC Registration
</h1>

<p class="subtitle">
Register for the GMSC examination.
Please enter your correct details.
</p>

<form
id="registrationForm"
>

<label>
Full Name
</label>

<input
id="name"
type="text"
placeholder="Enter your full name"
required
>

<label>
Phone Number
</label>

<input
id="phone"
type="tel"
placeholder="Enter your phone number"
maxlength="15"
required
>

<label>
Email Address
</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
required
>

<button
type="submit"
>
Register Now
</button>

</form>


<div
id="message"
class="message"
>
</div>


<div
id="registrationResult"
>
</div>


<a
class="back"
href="/"
>
← Back to GMSC Home
</a>

</div>

</div>


<script>

const form =
    document.getElementById(
        "registrationForm"
    );

const message =
    document.getElementById(
        "message"
    );

const registrationResult =
    document.getElementById(
        "registrationResult"
    );


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.style.display =
            "none";

        registrationResult.innerHTML =
            "";

        const name =
            document.getElementById(
                "name"
            ).value.trim();

        const phone =
            document.getElementById(
                "phone"
            ).value.trim();

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        try{

            const response =
                await fetch(
                    "/api/register",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name,

                                phone,

                                email
                            })
                    }
                );

            const data =
                await response.json();

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Registration failed."
                );
            }

            message.className =
                "message success";

            message.textContent =
                "Registration successful!";

            message.style.display =
                "block";

            registrationResult.innerHTML = `

<div class="registration-id">

Registration ID:
${escapeHtml(
    data.registrationId
)}

<br><br>

Name:
${escapeHtml(
    data.student.name
)}

<br>

Phone:
${escapeHtml(
    data.student.phone
)}

<br>

Email:
${escapeHtml(
    data.student.email
)}

</div>

`;

            form.reset();

        }catch(error){

            message.className =
                "message error";

            message.textContent =
                error.message;

            message.style.display =
                "block";
        }
    }
);


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>

</html>
