<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GMSC | Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#07152f,#104f8a);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.login-box{
    width:100%;
    max-width:450px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-circle{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#28c7e8;
    color:#07152f;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 12px;
    font-weight:bold;
    font-size:20px;
}

.logo h1{
    color:#07152f;
    font-size:30px;
}

.logo p{
    color:#667085;
    margin-top:6px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#172033;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.form-group input:focus{
    border-color:#28c7e8;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#07152f;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#104f8a;
}

.links{
    text-align:center;
    margin-top:22px;
}

.links a{
    color:#104f8a;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">

        <div class="logo-circle">
            GM
        </div>

        <h1>GMSC</h1>

        <p>Student Login</p>

    </div>


   <form onsubmit="startExam(event)">
            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn">
            Login
        </button>

    </form>


    <div class="links">

        <p>
            New participant?
            <a href="register.html">
                Register here
            </a>
        </p>

        <br>

        <a href="index.html">
            ← Back to GMSC Home
        </a>

    </div>

</div>

<script>



   function startExam(event){

    event.preventDefault();

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
